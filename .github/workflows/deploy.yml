name: Deploy to Cloudflare Workers

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Build & Deploy
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Build (esbuild bundle)
        run: npm run build

      # ── Step 1: 自动创建/获取 KV Namespace ──
      - name: Setup KV Namespace
        id: kv
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          KV_TITLE="cloudflare-tap-CARD_ORDER"

          echo "🔍 Checking for existing KV namespace: ${KV_TITLE}"
          EXISTING=$(curl -s -X GET \
            "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/storage/kv/namespaces?per_page=100" \
            -H "Authorization: Bearer ${CF_API_TOKEN}" \
            -H "Content-Type: application/json")

          KV_ID=$(echo "$EXISTING" | jq -r --arg title "$KV_TITLE" '.result[] | select(.title == $title) | .id // empty')

          if [ -z "$KV_ID" ]; then
            echo "📦 Creating new KV namespace: ${KV_TITLE}"
            CREATE_RESULT=$(curl -s -X POST \
              "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/storage/kv/namespaces" \
              -H "Authorization: Bearer ${CF_API_TOKEN}" \
              -H "Content-Type: application/json" \
              --data "{\"title\":\"${KV_TITLE}\"}")

            KV_ID=$(echo "$CREATE_RESULT" | jq -r '.result.id // empty')
            if [ -z "$KV_ID" ]; then
              echo "❌ Failed to create KV namespace"
              echo "$CREATE_RESULT" | jq .
              exit 1
            fi
            echo "✅ Created KV namespace: ${KV_ID}"
          else
            echo "✅ Found existing KV namespace: ${KV_ID}"
          fi

          echo "kv_id=${KV_ID}" >> $GITHUB_OUTPUT

      # ── Step 2: 准备明文变量并配置 wrangler.toml ──
      - name: Prepare Plain Text Variables & Update wrangler.toml
        id: vars
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          INPUT_JWT_SECRET: ${{ secrets.JWT_SECRET }}
          INPUT_ADMIN_USERNAME: ${{ secrets.ADMIN_USERNAME }}
          INPUT_ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
        run: |
          WORKER_NAME="cloudflare-tap"

          # 1. 替换 KV_ID
          KV_ID="${{ steps.kv.outputs.kv_id }}"
          sed -i "s/PLACEHOLDER/${KV_ID}/g" wrangler.toml

          # 2. 提取变量（优先使用用户在 GitHub Secrets 填的值，无则自动生成）
          # ADMIN_USERNAME
          if [ -n "$INPUT_ADMIN_USERNAME" ]; then
            USERNAME_VAL="$INPUT_ADMIN_USERNAME"
          else
            USERNAME_VAL="admin"
          fi

          # ADMIN_PASSWORD (8 位)
          if [ -n "$INPUT_ADMIN_PASSWORD" ]; then
            PASSWORD_VAL="$INPUT_ADMIN_PASSWORD"
          else
            PASSWORD_VAL=$(openssl rand -base64 12 | tr -dc 'a-zA-Z0-9' | head -c 8)
            if [ ${#PASSWORD_VAL} -lt 8 ]; then
              PASSWORD_VAL="admin123"
            fi
          fi

          # JWT_SECRET (64 位)
          if [ -n "$INPUT_JWT_SECRET" ]; then
            JWT_VAL="$INPUT_JWT_SECRET"
          else
            JWT_VAL=$(openssl rand -base64 48 | tr -dc 'a-zA-Z0-9' | head -c 64)
          fi

          # 3. 将变量追加写入 wrangler.toml 的 [vars] 中 (以明文变量形式部署)
          cat << EOF >> wrangler.toml

ADMIN_USERNAME = "${USERNAME_VAL}"
ADMIN_PASSWORD = "${PASSWORD_VAL}"
JWT_SECRET = "${JWT_VAL}"
EOF

          echo "📝 Updated wrangler.toml with plain text variables:"
          cat wrangler.toml

          # 4. 清理 Cloudflare 上历史遗留的加密 secrets (暗文“值已加密”，避免遮挡明文变量)
          delete_secret() {
            local sec_name=$1
            curl -s -X DELETE \
              "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/workers/scripts/${WORKER_NAME}/secrets/${sec_name}" \
              -H "Authorization: Bearer ${CF_API_TOKEN}" \
              -H "Content-Type: application/json" >/dev/null 2>&1 || true
          }

          echo "🧹 Cleaning up legacy encrypted secret_text bindings if any..."
          delete_secret "ADMIN_USERNAME"
          delete_secret "ADMIN_PASSWORD"
          delete_secret "JWT_SECRET"

          # 输出到 GITHUB_OUTPUT 供摘要显示
          echo "username=${USERNAME_VAL}" >> $GITHUB_OUTPUT
          echo "password=${PASSWORD_VAL}" >> $GITHUB_OUTPUT
          echo "jwt_secret=${JWT_VAL}" >> $GITHUB_OUTPUT

      # ── Step 3: 部署 Worker (包含明文变量) ──
      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # ── Step 4: 部署摘要 ──
      - name: Deployment Summary
        run: |
          echo ""
          echo "╔══════════════════════════════════════════════════╗"
          echo "║          🚀 CloudflareTap 部署成功！                   ║"
          echo "╠══════════════════════════════════════════════════╣"
          echo "║                                                  ║"
          echo "║  📌 Worker:          cloudflare-tap                    ║"
          echo "║  📦 KV ID:           ${{ steps.kv.outputs.kv_id }}
          echo "║                                                  ║"
          echo "║  👤 ADMIN_USERNAME:  ${{ steps.vars.outputs.username }}
          echo "║  🔒 ADMIN_PASSWORD:  ${{ steps.vars.outputs.password }}
          echo "║  🔑 JWT_SECRET:      ${{ steps.vars.outputs.jwt_secret }}
          echo "║                                                  ║"
          echo "║  💡 在 Cloudflare Dashboard 查看/修改明文变量:    ║"
          echo "║     Workers > cloudflare-tap > Settings > Variables     ║"
          echo "║                                                  ║"
          echo "╚══════════════════════════════════════════════════╝"
